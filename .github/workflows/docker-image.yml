name: Garden Maintenance Fullstack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./GardenMaintenanceServiceProject
          file: ./GardenMaintenanceServiceProject/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/manjusha-06/garden-backend-2400032300:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./garden-maintenance-frontend
          file: ./garden-maintenance-frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/manjusha-06/garden-frontend-2400032300:latest
